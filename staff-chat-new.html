<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>หน้าจอเจ้าหน้าที่</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f1f5f9;color:#172033;font-family:system-ui,sans-serif}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #dbe2ea;border-radius:16px;padding:16px;margin-bottom:12px}h1{margin:0 0 8px}input,button,textarea{font:inherit;padding:11px;border:1px solid #cbd5e1;border-radius:10px}button{background:#2563eb;color:#fff;border:0;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:12px}.sessions button{display:block;width:100%;text-align:left;margin:6px 0;background:#eff6ff;color:#1e3a8a}.muted{color:#64748b;font-size:.9rem}#messages{height:45vh;overflow:auto;background:#f8fafc;border-radius:10px;padding:10px}.msg{padding:10px;margin:7px 0;background:#e2e8f0;border-radius:10px;white-space:pre-wrap;overflow-wrap:anywhere}.staff{background:#dbeafe}.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1;min-width:0}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="card"><h1>🧑‍💼 ระบบแชทเจ้าหน้าที่</h1><p class="muted">เฉพาะบัญชีที่ผู้ดูแลเพิ่มในตาราง chat_staff เท่านั้นจึงจะเห็นรายการแชท</p>
<div id="login"><input id="email" type="email" placeholder="อีเมลเจ้าหน้าที่"><input id="password" type="password" placeholder="รหัสผ่าน"><button id="signIn">เข้าสู่ระบบ</button><p id="status" class="muted"></p></div>
<div id="desk" class="hidden"><button id="signOut">ออกจากระบบ</button><p id="staffStatus" class="muted"></p></div></section>
<div id="workspace" class="grid hidden"><section class="card"><h2>ห้องแชท</h2><div id="sessions" class="sessions"></div></section>
<section class="card"><h2 id="title">เลือกห้องแชท</h2><div id="messages"></div><div class="row"><input id="reply" placeholder="พิมพ์คำตอบเจ้าหน้าที่..." maxlength="4000"><button id="send">ส่ง</button></div><div class="row"><button id="close" style="background:#475569">ปิดเคส</button></div></section></div></main>
<script>
const SUPABASE_URL="https://aefzegkgfwszuiznihsk.supabase.co";
const SUPABASE_ANON_KEY="PUT_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let user=null,activeId=null,channel=null;
const $=id=>document.getElementById(id);const say=(id,t)=>$(id).textContent=t;
async function loadSessions(){const {data,error}=await db.from('chat_sessions').select('id,status,student_user_id,last_message_at').order('last_message_at',{ascending:false}).limit(100);if(error){say('staffStatus','โหลดห้องแชทไม่ได้: '+error.message);return;}const host=$('sessions');host.innerHTML='';(data||[]).forEach(s=>{const b=document.createElement('button');b.textContent=(s.status==='open'?'🟢':'⚪')+' '+s.id.slice(0,8)+' · '+s.status;b.onclick=()=>openSession(s);host.appendChild(b);});}
async function openSession(s){activeId=s.id;$('title').textContent='ห้อง '+s.id.slice(0,8)+' · '+s.status;$('messages').innerHTML='';const {data,error}=await db.from('chat_messages').select('*').eq('session_id',activeId).order('created_at');if(error){say('staffStatus',error.message);return;}(data||[]).forEach(m=>addMessage((m.sender_role==='student'?'นักเรียน':m.sender_role==='bot'?'บอท':'เจ้าหน้าที่')+': '+m.message,m.sender_role==='staff'?'staff':''));if(channel)await db.removeChannel(channel);channel=db.channel('staff-'+activeId).on('postgres_changes',{event:'INSERT',schema:'public',table:'chat_messages',filter:'session_id=eq.'+activeId},p=>{if(p.new.sender_id!==user.id)addMessage((p.new.sender_role==='student'?'นักเรียน':p.new.sender_role==='bot'?'บอท':'เจ้าหน้าที่')+': '+p.new.message,'');}).subscribe();}
function addMessage(t,c){const d=document.createElement('div');d.className='msg '+(c||'');d.textContent=t;$('messages').appendChild(d);$('messages').scrollTop=$('messages').scrollHeight;}
$('signIn').onclick=async()=>{const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){say('status','เข้าสู่ระบบไม่สำเร็จ ตรวจสอบอีเมลและรหัสผ่าน');return;}user=data.user;const {data:staff,error:se}=await db.from('chat_staff').select('user_id').eq('user_id',user.id).maybeSingle();if(se||!staff){await db.auth.signOut();user=null;say('status','บัญชีนี้ยังไม่ได้รับสิทธิ์เจ้าหน้าที่');return;}$('login').classList.add('hidden');$('desk').classList.remove('hidden');$('workspace').classList.remove('hidden');say('staffStatus','เข้าสู่ระบบแล้ว');await loadSessions();};
$('send').onclick=async()=>{const t=$('reply').value.trim();if(!activeId||!t)return;const {error}=await db.from('chat_messages').insert({session_id:activeId,sender_id:user.id,sender_role:'staff',message:t});if(error){say('staffStatus','ส่งไม่สำเร็จ: '+error.message);return;}addMessage('เจ้าหน้าที่: '+t,'staff');$('reply').value='';};
$('reply').addEventListener('keydown',e=>{if(e.key==='Enter')$('send').click();});
$('close').onclick=async()=>{if(!activeId)return;const {error}=await db.from('chat_sessions').update({status:'closed'}).eq('id',activeId);if(error)say('staffStatus','ปิดเคสไม่สำเร็จ: '+error.message);else{say('staffStatus','ปิดเคสแล้ว');await loadSessions();}};
$('signOut').onclick=async()=>{if(channel)await db.removeChannel(channel);await db.auth.signOut();user=null;activeId=null;$('desk').classList.add('hidden');$('workspace').classList.add('hidden');$('login').classList.remove('hidden');};
</script></body></html>
